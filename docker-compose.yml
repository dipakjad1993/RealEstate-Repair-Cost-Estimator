services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      WHISPER_BACKEND: none
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    restart: unless-stopped

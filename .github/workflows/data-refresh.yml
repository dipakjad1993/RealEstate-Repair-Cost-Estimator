name: data-refresh
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh provenance-stamped snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python scripts/refresh_snapshots.py
      - name: Commit snapshots (content hashes + source URLs)
        run: |
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git -c user.name='scopeproof-bot' -c user.email='bot@users.noreply.github.com' \
              commit -q -m "chore(data): nightly provenance-stamped snapshots [skip ci]"
            git push
          fi

services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      WHISPER_BACKEND: none
      REDIS_URL: redis://redis:6379/0
      AUDIT_LOG_PATH: /app/data/audit_log.jsonl
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      AUDIT_LOG_PATH: /app/data/audit_log.jsonl
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    # Not exposed to the host — internal network only.

volumes:
  redis-data:
